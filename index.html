let _mergedCatMap = null;
function getCustomCatMap() {
  try { return JSON.parse(localStorage.getItem('cm:catmap') || '{}'); } catch { return {}; }
}
function setCustomCatMap(map) {
  localStorage.setItem('cm:catmap', JSON.stringify(map));
  _mergedCatMap = null;
}
function getMergedCatMap() {
  if (!_mergedCatMap) _mergedCatMap = Object.assign({}, INGREDIENT_CAT, getCustomCatMap());
  return _mergedCatMap;
}
function getAllKnownIngredients() {
  return Object.keys(getMergedCatMap()).sort((a,b)=>a.localeCompare(b,"it"));
}

// ── Ordine categorie (Dispensa/Spesa/Impostazioni) ─────
// Personalizzabile per seguire il percorso reale al supermercato; salvato per dispositivo
// come le regole di categorizzazione (cm:catmap), a cui è affiancato.
function getCatOrder() {
  let order;
  try { order = JSON.parse(localStorage.getItem("cm:catorder") || "null"); } catch { order = null; }
  if (!Array.isArray(order)) order = [];
  const known = SHOP_CATS.map(c => c.id);
  const cleaned = order.filter(id => known.includes(id));
  for (const id of known) if (!cleaned.includes(id)) cleaned.push(id);
  return cleaned;
}
function setCatOrder(order) { localStorage.setItem("cm:catorder", JSON.stringify(order)); }
function orderedShopCats() {
  const byId = Object.fromEntries(SHOP_CATS.map(c => [c.id, c]));
  return getCatOrder().map(id => byId[id]).filter(Boolean);
}
function moveCatOrder(catId, targetId) {
  if (!targetId) return;
  const order = getCatOrder();
  const i = order.indexOf(catId), j = order.indexOf(targetId);
  if (i < 0 || j < 0) return;
  [order[i], order[j]] = [order[j], order[i]];
  setCatOrder(order);
  render();
}
// Contiene needle come parola intera ("farina di ceci" contiene "ceci", "insalata" non contiene "sale")
function containsWord(hay, needle) {
  let idx = hay.indexOf(needle);
  while (idx !== -1) {
    const before = idx === 0 || " /(".includes(hay[idx - 1]);
    const after = idx + needle.length === hay.length || " /),".includes(hay[idx + needle.length]);
    if (before && after) return true;
    idx = hay.indexOf(needle, idx + 1);
  }
  return false;
}
function categorizeItem(name) {
  const lower = name.toLowerCase().trim();
  const map = getMergedCatMap();
  if (map[lower]) return map[lower];
  // Match per parola intera, preferendo la chiave più lunga (più specifica).
  // In direzione inversa solo come prefisso: "ceci" → "ceci cotti", ma "mele" ↛ "aceto di mele".
  let best = null;
  for (const [key, cat] of Object.entries(map)) {
    if (containsWord(lower, key) || key.startsWith(lower + " ")) {
      if (!best || key.length > best.len) best = {len: key.length, cat};
    }
  }
  return best ? best.cat : "varie";
}

function getWeekDates(offset) {
  const today = new Date();
  const dow = today.getDay();
  const monday = new Date(today);
  monday.setDate(today.getDate() - (dow === 0 ? 6 : dow - 1) + (offset || 0) * 7);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return d;
  });
}

const SEED_RECIPES = [
  {id:"r1",tag:"primavera",name:"Farro con asparagi, piselli e ricotta al limone",time:"30 min",grain:"Farro",protein:"Ricotta",note:"La ricotta va aggiunta a fuoco spento: si scioglie parzialmente creando una crema naturale.",ing:[{n:"farro semiperlato",a:200,u:"g"},{n:"asparagi",a:300,u:"g"},{n:"piselli freschi o surgelati",a:200,u:"g"},{n:"ricotta fresca",a:150,u:"g"},{n:"limone",a:1,u:"pz"},{n:"cipollotti",a:2,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il farro in acqua salata 20-25 min, scola.","Spezza gli asparagi eliminando la parte dura, tagliali a pezzetti.","Sbollenta asparagi e piselli 5 min in acqua salata, tienili al dente.","Soffriggi i cipollotti a rondelle in olio evo per 3 minuti.","Aggiungi asparagi e piselli, salta 2 minuti. Unisci il farro e mescola.","Spegni il fuoco. Aggiungi la ricotta a cucchiaiate e la scorza del limone: si scioglie parzialmente creando cremosità naturale. Un filo d'olio a finire."]},
  {id:"r2",tag:"primavera",name:"Quinoa con carciofi brasati e ceci al timo",time:"40 min",grain:"Quinoa",protein:"Ceci",note:"I carciofi immersi in acqua acidulata con limone non anneriscono mentre li pulisci.",ing:[{n:"quinoa",a:200,u:"g"},{n:"carciofi",a:4,u:"pz"},{n:"ceci cotti",a:400,u:"g"},{n:"aglio",a:2,u:"pz"},{n:"timo fresco",a:0,u:"qb"},{n:"limone",a:1,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci la quinoa (1:2) 15 min, lascia riposare coperta 5 min.","Pulisci i carciofi eliminando foglie dure e barbetta, tagliali a spicchi. Immergili in acqua e limone.","Soffriggi aglio in olio, aggiungi i carciofi scolati e brasali coperti a fuoco medio 15 min, aggiungendo poca acqua se serve.","Aggiungi i ceci e il timo, cuoci 5 minuti finché tutto ben insaporito.","Mescola con la quinoa. Servi con un filo d'olio e succo di limone."]},
  {id:"r3",tag:"primavera",name:"Riso integrale con fave, cipollotti e tofu alla menta",time:"45 min",grain:"Riso integrale",protein:"Tofu",note:"Le fave vanno sbucciate due volte: dal baccello e dalla pellicina verde. Vale la pena, diventano dolcissime.",ing:[{n:"riso integrale",a:200,u:"g"},{n:"fave fresche sgranate",a:300,u:"g"},{n:"tofu",a:250,u:"g"},{n:"cipollotti",a:3,u:"pz"},{n:"menta fresca",a:0,u:"qb"},{n:"aglio",a:1,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il riso integrale (1:2,5) 35-40 min per assorbimento.","Sbollenta le fave 3 min, scolale e sbucciale dalla pellicina esterna.","Pressa il tofu 15 min tra due piatti con un peso, taglia a cubetti.","Rosola il tofu in olio con l'aglio finché dorato su tutti i lati (8 min).","Soffriggi i cipollotti, aggiungi le fave e salta 2 minuti.","Unisci riso e tofu, mescola. A fuoco spento aggiungi abbondante menta fresca spezzettata a mano.","Adulti: un filo di tamari nel piatto."]},
  {id:"r4",tag:"primavera",name:"Orzo con agretti, ceci e uova strapazzate al limone",time:"30 min",grain:"Orzo",protein:"Ceci + Uova",note:"Gli agretti si sbollentano solo 2 minuti: devono restare leggermente croccanti e perdere solo l'amaro.",ing:[{n:"orzo perlato",a:180,u:"g"},{n:"agretti",a:300,u:"g"},{n:"ceci cotti",a:300,u:"g"},{n:"uova",a:4,u:"pz"},{n:"limone",a:1,u:"pz"},{n:"aglio",a:2,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci l'orzo in acqua salata 20-25 min, scola.","Sciacqua gli agretti ed elimina le radichette. Sbollentali 2 minuti, scola.","Soffriggi aglio in olio, aggiungi agretti e ceci, salta 3 minuti.","Sbatti le uova con la scorza grattugiata del limone. Strapazza in padella antiaderente a fuoco basso finché ben rapprese.","Assembla: orzo, agretti con ceci, uova strapazzate sopra. Spremi il limone a finire."]},
  {id:"r5",tag:"primavera",name:"Riso con sclopit/strigoli, patate e ricotta di capra",time:"35 min",grain:"Riso",protein:"Ricotta di capra",note:"Lo sclopit (strigoli in italiano) è un'erba selvatica primaverile dal sapore delicato. Se non la trovi usa spinacini.",ing:[{n:"riso integrale",a:200,u:"g"},{n:"sclopit/strigoli freschi",a:250,u:"g"},{n:"patate",a:2,u:"pz"},{n:"ricotta di capra",a:120,u:"g"},{n:"aglio",a:2,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il riso in acqua salata 18-20 min, scola.","Pela le patate, tagliale a dadini piccoli. Sbollenta 8 min finché morbide.","Lava gli sclopit, elimina i gambi più duri.","Soffriggi aglio in olio, aggiungi sclopit e patate, salta 4-5 min finché le erbe appassiscono.","Unisci il riso, mescola bene. A fuoco spento incorpora la ricotta di capra a cucchiaiate. Un filo d'olio evo a finire."]},
  {id:"r6",tag:"primavera",name:"Bowl di quinoa, ceci e spinaci al tahini",time:"30 min",grain:"Quinoa",protein:"Ceci",note:"Adulti: sciogli tamari o miso in poca acqua calda e aggiungi nel piatto.",ing:[{n:"quinoa",a:200,u:"g"},{n:"ceci cotti",a:400,u:"g"},{n:"spinaci freschi",a:200,u:"g"},{n:"cipolla rossa",a:1,u:"pz"},{n:"aglio",a:2,u:"pz"},{n:"tahini",a:3,u:"cucchiai"},{n:"limone",a:1,u:"pz"},{n:"cumino in polvere",a:1,u:"cucchiaino"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci la quinoa in acqua (1:2) per 15 min, lascia riposare coperta 5 min.","Rosola cipolla affettata e aglio in olio evo fino a doratura.","Aggiungi i ceci con il cumino, cuoci 5 min finché dorati.","Unisci gli spinaci e lascia appassire 2 minuti.","Frulla tahini con succo di limone e un cucchiaio d'acqua fino a crema fluida.","Assembla: quinoa alla base, ceci e spinaci sopra, filo di tahini.","Adulti: tamari o miso sciolto in acqua calda direttamente nel piatto."]},
  {id:"r7",tag:"estate",name:"Miglio al vapore con zucchine, edamame e crema tahini-limone",time:"25 min",grain:"Miglio",protein:"Edamame",note:"Tutto cotto al vapore, niente grassi in cottura. La crema di tahini è il condimento principale: non lesinare.",ing:[{n:"miglio",a:200,u:"g"},{n:"zucchine",a:3,u:"pz"},{n:"edamame sgranati surgelati",a:200,u:"g"},{n:"tahini",a:3,u:"cucchiai"},{n:"limone",a:1,u:"pz"},{n:"erba cipollina",a:0,u:"qb"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il miglio in acqua (1:2) 15-18 min, sgrana con una forchetta.","Taglia le zucchine a rondelle. Cuoci al vapore zucchine ed edamame per 8 minuti, tienili al dente.","Prepara la crema: mescola tahini, succo di limone e 2 cucchiai d'acqua fino a crema fluida.","Disponi il miglio nel piatto, distribuisci zucchine ed edamame sopra.","Versa la crema di tahini a filo, completa con erba cipollina tagliuzzata.","Adulti: qualche goccia di tamari nel piatto."]},
  {id:"r8",tag:"estate",name:"Orzo con fagiolini al vapore, uova sode e salsa yogurt alle erbe",time:"30 min",grain:"Orzo",protein:"Uova",note:"Le uova devono essere ben sode (10 minuti esatti). Raffreddale subito in acqua fredda: si sbucciano molto più facilmente.",ing:[{n:"orzo perlato",a:180,u:"g"},{n:"fagiolini",a:300,u:"g"},{n:"uova",a:4,u:"pz"},{n:"yogurt bianco naturale",a:100,u:"g"},{n:"menta e basilico freschi",a:0,u:"qb"},{n:"limone",a:1,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci l'orzo in acqua salata 20-25 min, scola e lascia intiepidire.","Lessa le uova in acqua bollente esattamente 10 minuti. Raffredda subito in acqua fredda, sbuccia e taglia a spicchi.","Cuoci i fagiolini al vapore 7-8 minuti, tienili croccanti.","Prepara la salsa: mescola yogurt, erbe tritate, succo di limone e un filo d'olio evo.","Assembla: orzo, fagiolini, uova a spicchi. Distribuisci la salsa yogurt sopra."]},
  {id:"r9",tag:"estate",name:"Riso venere con salmone al vapore e zucchine trifolate",time:"45 min",grain:"Riso venere",protein:"Salmone",note:"Il riso venere è saporito di suo e regge bene il salmone delicato. Tutto cotto — sicuro in gravidanza.",ing:[{n:"riso venere",a:200,u:"g"},{n:"salmone (tranci)",a:400,u:"g"},{n:"zucchine",a:2,u:"pz"},{n:"limone",a:1,u:"pz"},{n:"erba cipollina",a:0,u:"qb"},{n:"aglio",a:1,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il riso venere in acqua salata 35-40 min, scola.","Taglia le zucchine a dadini. Soffriggi aglio in olio, aggiungi le zucchine e cuoci 7-8 min finché tenere e leggermente dorate.","Cuoci il salmone al vapore 12-15 minuti finché si sfalda con la forchetta.","Sfalda il salmone a pezzi grossi eliminando la pelle.","Assembla: riso venere, zucchine, salmone. Condisci con olio evo, succo di limone e erba cipollina abbondante."]},
  {id:"r10",tag:"estate",name:"Orzo con tempeh, zucchine e pomodorini",time:"35 min",grain:"Orzo",protein:"Tempeh",note:"Sbollenta il tempeh 5 minuti prima per un sapore più delicato.",ing:[{n:"orzo perlato",a:200,u:"g"},{n:"tempeh",a:250,u:"g"},{n:"zucchine",a:2,u:"pz"},{n:"pomodorini",a:300,u:"g"},{n:"aglio",a:3,u:"pz"},{n:"paprika affumicata",a:1,u:"cucchiaino"},{n:"basilico fresco",a:0,u:"qb"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci l'orzo in acqua salata 20-25 min, scola al dente.","Sbollenta il tempeh a cubetti 5 min (opzionale), asciuga bene.","Rosola il tempeh con paprika e aglio finché croccante (8-10 min).","Aggiungi zucchine a rondelle, cuoci 5 minuti.","Aggiungi i pomodorini tagliati a metà, cuoci 5 minuti.","Unisci l'orzo, mescola e lascia amalgamare 2 minuti.","Servi con basilico fresco spezzettato a mano."]},
  {id:"r11",tag:"estate",name:"Salmone al forno con farro e fagiolini",time:"35 min",grain:"Farro",protein:"Salmone",note:"Il farro condito si conserva benissimo per il pranzo del giorno dopo.",ing:[{n:"salmone (tranci)",a:400,u:"g"},{n:"farro semiperlato",a:200,u:"g"},{n:"fagiolini",a:300,u:"g"},{n:"limone",a:1,u:"pz"},{n:"timo fresco",a:0,u:"qb"},{n:"aglio",a:2,u:"pz"},{n:"capperi",a:1,u:"cucchiaio"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il farro in acqua salata 20-25 min, scola.","Sbollenta i fagiolini 5 min, tienili croccanti.","Disponi il salmone in teglia con olio, aglio, timo e limone a fette.","Cuoci in forno a 200°C per 12-15 min (si sfalda quando pronto).","Salta il farro con fagiolini e capperi in padella per 3 minuti.","Servi il salmone sopra il farro con i fagiolini."]},
  {id:"r12",tag:"autunno",name:"Bowl di farro con zucca arrosto, tempeh e semi di zucca",time:"40 min",grain:"Farro",protein:"Tempeh",note:"La zucca lasciata con la buccia diventa più saporita. Se la buccia è dura toglila dopo la cottura.",ing:[{n:"farro semiperlato",a:200,u:"g"},{n:"zucca",a:500,u:"g"},{n:"tempeh",a:250,u:"g"},{n:"semi di zucca",a:2,u:"cucchiai"},{n:"salvia fresca",a:0,u:"qb"},{n:"aglio",a:2,u:"pz"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il farro in acqua salata 20-25 min, scola.","Taglia la zucca a dadini, condisci con olio e salvia, inforna a 200°C per 25-30 min finché dorata ai bordi.","Taglia il tempeh a cubetti. Rosola con aglio in olio finché croccante (8-10 min).","Tosta i semi di zucca in padella secca 2-3 min, metti da parte.","Assembla: farro, zucca arrosto, tempeh. Cospargi i semi di zucca.","Adulti: un filo di tamari o salsa di soia nel piatto."]},
  {id:"r13",tag:"autunno",name:"Amaranto con funghi trifolati, lenticchie nere e castagne",time:"35 min",grain:"Amaranto",protein:"Lenticchie nere",note:"I funghi vanno cotti a fuoco alto senza mescolare troppo per dorare, non stufare. Le castagne danno una dolcezza inaspettata.",ing:[{n:"amaranto",a:180,u:"g"},{n:"funghi misti",a:300,u:"g"},{n:"lenticchie nere cotte",a:200,u:"g"},{n:"castagne bollite",a:100,u:"g"},{n:"aglio",a:2,u:"pz"},{n:"timo fresco",a:0,u:"qb"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci l'amaranto (1:2,5) 20 min, tienilo leggermente morbido.","Trifola i funghi: soffriggi aglio in olio a fuoco alto, aggiungi i funghi tagliati e cuoci senza mescolare troppo finché dorati (8-10 min). Aggiungi il timo.","Unisci le lenticchie nere, scalda 3 minuti.","Sbricciola grossolanamente le castagne bollite.","Assembla: amaranto, funghi con lenticchie, castagne sbriciolate sopra.","Adulti: miso sciolto nel piatto o olio evo a crudo."]},
  {id:"r14",tag:"autunno",name:"Orzo con cavolo cappuccio brasato, ceci e feta",time:"40 min",grain:"Orzo",protein:"Ceci + Feta",note:"Il cavolo cappuccio brasato a lungo perde l'amaro e diventa quasi dolce. Non avere fretta con la cottura.",ing:[{n:"orzo perlato",a:200,u:"g"},{n:"cavolo cappuccio",a:400,u:"g"},{n:"ceci cotti",a:300,u:"g"},{n:"feta",a:100,u:"g"},{n:"aglio",a:2,u:"pz"},{n:"aceto di mele",a:1,u:"cucchiaio"},{n:"cumino",a:1,u:"cucchiaino"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci l'orzo in acqua salata 20-25 min, scola.","Affetta sottilmente il cavolo cappuccio. Soffriggi aglio in olio, aggiungi il cavolo e cuoci coperto a fuoco medio 15-20 min mescolando spesso finché morbido.","Sfuma con l'aceto di mele, aggiungi cumino e ceci, cuoci 5 min.","Unisci l'orzo, mescola. Servi con feta sbriciolata sopra che sciogliendosi condisce il tutto."]},
  {id:"r15",tag:"autunno",name:"Pasta e fagioli con cavolo nero e rosmarino",time:"45 min",grain:"Pasta",protein:"Fagioli borlotti",note:"La pasta va cotta direttamente nella zuppa per assorbire i sapori. Deve risultare cremosa, non brodosa.",ing:[{n:"pasta corta (ditalini o tubetti)",a:200,u:"g"},{n:"fagioli borlotti cotti",a:500,u:"g"},{n:"cavolo nero",a:200,u:"g"},{n:"rosmarino fresco",a:0,u:"qb"},{n:"aglio",a:3,u:"pz"},{n:"concentrato di pomodoro",a:1,u:"cucchiaio"},{n:"brodo vegetale",a:800,u:"ml"},{n:"olio evo",a:0,u:"qb"}],steps:["Soffriggi aglio e rosmarino in abbondante olio evo a fuoco medio.","Aggiungi il concentrato di pomodoro, tosta 1 minuto mescolando.","Unisci i fagioli e il brodo, porta a ebollizione. Frulla metà dei fagioli per una consistenza cremosa.","Aggiungi il cavolo nero a listarelle (eliminando la costa centrale) e cuoci 5 minuti.","Versa la pasta e cuoci al dente. Aggiusta la densità con brodo se serve.","Lascia riposare 5 minuti. Adulti: abbondante olio evo a crudo."]},
  {id:"r16",tag:"autunno",name:"Riso integrale, tofu al sesamo e broccoletti",time:"40 min",grain:"Riso integrale",protein:"Tofu",note:"Pressa il tofu 15 minuti con un peso: la texture croccante ne vale la pena.",ing:[{n:"riso integrale",a:200,u:"g"},{n:"tofu",a:300,u:"g"},{n:"broccoletti",a:400,u:"g"},{n:"semi di sesamo",a:3,u:"cucchiai"},{n:"zenzero fresco",a:1,u:"pz"},{n:"aglio",a:2,u:"pz"},{n:"olio di sesamo tostato",a:1,u:"cucchiaio"},{n:"olio evo",a:0,u:"qb"}],steps:["Cuoci il riso integrale (1:2,5) per 35-40 minuti per assorbimento.","Pressa il tofu 15 min poi taglia a cubetti da 2cm.","Tosta i semi di sesamo in padella secca fino a doratura, metti da parte.","Rosola il tofu in olio caldo finché dorato su tutti i lati (8 min).","Soffriggi zenzero e aglio grattugiati, aggiungi i broccoletti a cimette.","Cuoci al dente con un goccio d'acqua (5-6 min), il verde deve restare vivace.","Assembla con riso, tofu e broccoletti, cospargi sesamo e olio di sesamo.","Adulti: salsa di soia o tamari a piacere."]},
  {id:"r17",tag:"autunno",name:"Minestra di fagioli borlotti e amaranto",time:"30 min",grain:"Amaranto",protein:"Fagioli borlotti",note:"Cuoci i borlotti secchi nel weekend e congelali in porzioni da 400g. L'amaranto assorbe molto: tienila più liquida del solito.",ing:[{n:"fagioli borlotti cotti",a:500,u:"g"},{n:"amaranto",a:120,u:"g"},{n:"carote",a:2,u:"pz"},{n:"patate",a:2,u:"pz"},{n:"rosmarino fresco",a:0,u:"qb"},{n:"aglio",a:3,u:"pz"},{n:"concentrato di pomodoro",a:2,u:"cucchiai"},{n:"brodo vegetale",a:1000,u:"ml"},{n:"olio evo",a:0,u:"qb"}],steps:["Soffriggi aglio e rosmarino in olio evo per 2 minuti.","Aggiungi il concentrato di pomodoro, tosta 1 minuto.","Unisci carote e patate a dadini, fagioli e brodo caldo.","Porta a ebollizione, aggiungi l'amaranto e cuoci 20 minuti.","Frulla un terzo della minestra e rimetti nel tegame per cremosità.","Adulti: miso sciolto nel piatto o olio evo a crudo."]},
  {id:"r18",tag:"inverno",name:"Polenta con ragù di lenticchie rosse e seitan",time:"55 min",grain:"Polenta",protein:"Lenticchie + Seitan",note:"Le lenticchie rosse si sciolgono cuocendo e addensano il ragù naturalmente. Più cuoce, più è saporito.",ing:[{n:"farina di polenta",a:200,u:"g"},{n:"seitan",a:200,u:"g"},{n:"lenticchie rosse",a:150,u:"g"},{n:"passata di pomodoro",a:400,u:"g"},{n:"carota",a:1,u:"pz"},{n:"sedano",a:1,u:"pz"},{n:"cipolla",a:1,u:"pz"},{n:"brodo vegetale",a:600,u:"ml"},{n:"salvia fresca",a:0,u:"qb"},{n:"olio evo",a:0,u:"qb"}],steps:["Soffriggi cipolla, carota e sedano tritati in olio per 8 minuti.","Aggiungi il seitan tritato grossolanamente, rosola 5 minuti.","Unisci passata, lenticchie rosse e brodo. Cuoci a fuoco basso 30-40 min: le lenticchie si sciolgono addensando il sugo.","Prepara la polenta: porta a ebollizione 800ml di acqua salata. Versa la farina a pioggia mescolando costantemente. Cuoci 40 min (o usa polenta istantanea).","Servi la polenta morbida con il ragù sopra e un filo d'olio evo."]},
  {id:"r19",tag:"inverno",name:"Zuppa di cannellini, cavolo nero e farro tostato",time:"45 min",grain:"Farro tostato",protein:"Cannellini",note:"Tostare il farro prima di aggiungerlo alla zuppa gli dà una profondità di sapore quasi nocciolata — non saltare questo passaggio.",ing:[{n:"fagioli cannellini cotti",a:500,u:"g"},{n:"cavolo nero",a:250,u:"g"},{n:"farro semiperlato",a:180,u:"g"},{n:"aglio",a:3,u:"pz"},{n:"rosmarino fresco",a:0,u:"qb"},{n:"brodo vegetale",a:1200,u:"ml"},{n:"olio evo",a:0,u:"qb"}],steps:["Tosta il farro in padella secca a fuoco medio 5 minuti mescolando spesso, finché profumato e leggermente dorato.","Soffriggi aglio e rosmarino in abbondante olio evo.","Aggiungi i cannellini e il brodo, porta a ebollizione. Frulla circa un terzo per cremosità.","Aggiungi il cavolo nero a listarelle (eliminando la costa centrale dura) e il farro tostato. Cuoci 25 minuti a fuoco medio.","Adulti: olio evo a crudo abbondante e miso sciolto nel piatto."]},

// ═══════════════════════════════════════════════════════
// STORAGE
// ═══════════════════════════════════════════════════════
// ── CONFIGURAZIONE CLOUDFLARE ──────────────────────────
// Il token NON è salvato nel codice: si inserisce una volta
// per dispositivo in Impostazioni (deve corrispondere al
// segreto AUTH_TOKEN del Worker).
const WORKER_URL = "https://meal-planner-api.michelecoppino.workers.dev";
function getToken() { try { return localStorage.getItem("cm:token") || ""; } catch { return ""; } }
// ───────────────────────────────────────────────────────

const SK = {r:"cm:r:v1",w:"cm:w:v1",p:"cm:p:v1",s:"cm:s:v1",b:"cm:b:v1",wb:"cm:wb:v1",wl:"cm:wl:v1",d:"cm:d:v1"};
// "d" (scorte desiderate) prima di "p": il caricamento della dispensa vi aggiunge i default
const STORE_KEYS = ["r","w","b","wb","wl","d","p","s"];

// Versione (timestamp) dell'ultimo valore remoto conosciuto per ciascuna chiave KV: usata per la
// scrittura ottimistica in sSet, così due dispositivi non si sovrascrivono a vicenda in silenzio.
const _remoteVersion = {};

async function sGet(key) {
  const token = getToken();
  if (!token) return null;
  try {
    const r = await fetch(`${WORKER_URL}/get?key=${encodeURIComponent(key)}`, {
      headers: {"X-Auth": token}
    });
    if (!r.ok) return null;
    const d = await r.json();
    if (typeof d.version === "number") _remoteVersion[key] = d.version;
    return d.value ? JSON.parse(d.value) : null;
  } catch { return null; }
}

// Ritorna {ok}, {ok:false} (errore/rete), oppure {ok:false, conflict:true, remoteValue} se un
// altro dispositivo ha scritto nel frattempo (versione remota diversa da quella letta l'ultima volta).
async function sSet(key, val) {
  const token = getToken();
  if (!token) return {ok: false};
  try {
    const r = await fetch(`${WORKER_URL}/set`, {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Auth": token},
      body: JSON.stringify({key, value: JSON.stringify(val), expectedVersion: _remoteVersion[key]})
    });
    const d = await r.json().catch(() => null);
    if (r.status === 409) {
      if (d && typeof d.version === "number") _remoteVersion[key] = d.version;
      return {ok: false, conflict: true, remoteValue: d && d.value ? JSON.parse(d.value) : null};
    }
    if (!r.ok) return {ok: false};
    if (d && typeof d.version === "number") _remoteVersion[key] = d.version;
    return {ok: true};
  } catch { return {ok: false}; }
}

function applyVal(k, val) {
  if (val === null || val === undefined) return;
  if (k==="r") state.recipes = val;
  else if (k==="w") state.weekPlan = migrateWeekData(val);
  else if (k==="d") state.desired = (val && typeof val === "object" && !Array.isArray(val)) ? val : {};
  else if (k==="p") {
    state.pantry = val;
    // Default scorte: la quantità desiderata parte da quella che hai ora
    for (const p of val) seedDesired(p.name, p.desired != null ? p.desired : p.qty, p.unit);
  }
  else if (k==="s") state.shopping = val.map(i => i.manual ? {...i, category: categorizeItem(i.name)} : i);
  else if (k==="b") state.breakfasts = val;
  else if (k==="wb") state.weekBreakfast = migrateWeekData(val);
  else if (k==="wl") state.weekLunch = migrateWeekData(val);
}

function loadLocal() {
  for (const k of STORE_KEYS) {
    try {
      const raw = localStorage.getItem(SK[k]);
      if (raw !== null) applyVal(k, JSON.parse(raw));
    } catch {}
  }
}

async function loadRemote() {
  const vals = await Promise.all(STORE_KEYS.map(k => sGet(SK[k])));
  STORE_KEYS.forEach((k, i) => applyVal(k, vals[i]));
}

// Rifà il refresh di tutte le chiavi dal Worker (ritorno in foreground da un altro dispositivo che
// potrebbe aver scritto nel frattempo). Salta le chiavi con un salvataggio locale ancora in volo,
// per non sovrascriverle con un fetch potenzialmente già superato.
async function refreshAllFromRemote() {
  if (!getToken()) return;
  const vals = await Promise.all(STORE_KEYS.map(k => hasPendingSave(k) ? Promise.resolve(undefined) : sGet(SK[k])));
  let changed = false;
  STORE_KEYS.forEach((k, i) => {
    const v = vals[i];
    if (v === undefined) return;
    applyVal(k, v);
    changed = true;
    if (v !== null) { try { localStorage.setItem(SK[k], JSON.stringify(v)); } catch {} }
  });
  if (changed) render();
}

// Unione "migliore sforzo" per conflitti sulla lista della spesa: le voci del salvataggio locale
// (appena spuntate/aggiunte su questo dispositivo) vincono a parità di id, ma le voci presenti solo
// nella versione remota (aggiunte da un altro dispositivo nel frattempo) vengono comunque incluse.
function mergeShoppingConflict(localVal, remoteVal) {
  const byId = new Map();
  for (const i of remoteVal) byId.set(i.id, i);
  for (const i of localVal) byId.set(i.id, i);
  return Array.from(byId.values());
}

// Coda per chiave: serializza le scritture verso il Worker, così un salvataggio
// lento non può sovrascrivere in ritardo uno più recente.
const _saveQueue = {};
const _pendingCount = {};
function hasPendingSave(k) { return (_pendingCount[SK[k]] || 0) > 0; }

function save(k, val) {
  try { localStorage.setItem(SK[k], JSON.stringify(val)); } catch {}
  if (!getToken()) { updateSyncBadge("⚙️ Sync non attiva — tocca qui"); return; }
  const payload = JSON.stringify(val);
  const kvKey = SK[k];
  _pendingCount[kvKey] = (_pendingCount[kvKey] || 0) + 1;
  _saveQueue[k] = (_saveQueue[k] || Promise.resolve())
    .then(() => sSet(kvKey, JSON.parse(payload)))
    .then(res => {
      _pendingCount[kvKey] = Math.max(0, (_pendingCount[kvKey] || 0) - 1);
      handleSaveResult(k, JSON.parse(payload), res);
    });
}

function handleSaveResult(k, localVal, res) {
  if (res.ok) { updateSyncBadge(null); return; }
  if (res.conflict && res.remoteValue !== null && res.remoteValue !== undefined) {
    const merged = k === "s" ? mergeShoppingConflict(localVal, res.remoteValue) : res.remoteValue;
    applyVal(k, merged);
    try { localStorage.setItem(SK[k], JSON.stringify(merged)); } catch {}
    render();
    toast(k === "s" ? "Lista della spesa sincronizzata con un altro dispositivo" : "Dati aggiornati da un altro dispositivo");
    save(k, merged); // riallinea il Worker alla versione unita, ora aggiornata
    return;
  }
  updateSyncBadge("⚠ Errore salvataggio");
}

function uid() { return Math.random().toString(36).slice(2,9); }
// Voci del piano non legate a una ricetta (es. "Pizza", "Cena fuori")
const CUSTOM_PREFIX = "__custom__:";
function isCustomEntry(v) { return typeof v === "string" && v.startsWith(CUSTOM_PREFIX); }
function customName(v) { return v.slice(CUSTOM_PREFIX.length); }
// Una voce di piano (cena/colazione) è una stringa id (scala 1×), un oggetto
// {id,scale} per porzioni scalate, o una stringa custom (CUSTOM_PREFIX).
function planRef(raw) {
  if (!raw) return null;
  if (isCustomEntry(raw)) return {custom:true, text: customName(raw)};
  if (typeof raw === "object" && raw.id) return {custom:false, id: raw.id, scale: raw.scale > 0 ? raw.scale : 1};
  return {custom:false, id: raw, scale: 1};
}
function planRawFor(id, scale) { return scale && scale !== 1 ? {id, scale} : id; }
function h(str) { return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
// Per valori interpolati dentro stringhe JS negli attributi onclick: prima escape JS, poi HTML
function ja(str) { return h(String(str).replace(/\\/g,"\\\\").replace(/'/g,"\\'")); }

function weekKey(offset) {
  const d = getWeekDates(offset || 0)[0];
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function currentPlan() {
  const k = weekKey(state.weekOffset);
  if (!state.weekPlan[k]) state.weekPlan[k] = {};
  return state.weekPlan[k];
}
function currentBPlan() {
  const k = weekKey(state.weekOffset);
  if (!state.weekBreakfast[k]) state.weekBreakfast[k] = {};
  return state.weekBreakfast[k];
}
// Pranzo: {giorno: "testo custom"} — assente = automatico (avanzi della cena precedente)
function currentLunchPlan() {
  const k = weekKey(state.weekOffset);
  if (!state.weekLunch[k]) state.weekLunch[k] = {};
  return state.weekLunch[k];
}
// Vecchio formato: {Lunedì: rid, ...} → nuovo: {"YYYY-MM-DD": {Lunedì: rid, ...}}
function migrateWeekData(obj) {
  if (!obj || typeof obj !== "object") return {};
  if (Object.keys(obj).some(k => DAYS.includes(k))) return { [weekKey(0)]: obj };
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - 90);
  for (const k of Object.keys(obj)) { const d = new Date(k); if (!isNaN(d) && d < cutoff) delete obj[k]; }
  return obj;
}
function seasonForDate(d) {
  const m = d.getMonth() + 1;
  return m >= 3 && m <= 5 ? "primavera" : m >= 6 && m <= 8 ? "estate" : m >= 9 && m <= 11 ? "autunno" : "inverno";
}
function toBase(a, u) {
  u = (u || "").toLowerCase();
  if (u === "kg") return {v: a*1000, d: "g"};
  if (u === "g")  return {v: a, d: "g"};
  if (u === "l")  return {v: a*1000, d: "ml"};
  if (u === "ml") return {v: a, d: "ml"};
  if (u === "pz") return {v: a, d: "pz"};
  return null;
}
function qtyStep(unit) { return (unit === 'g' || unit === 'ml') ? 50 : (unit === 'kg' || unit === 'l') ? 0.5 : 1; }

// ── Scorte desiderate (mappa nome → {q, u}) ────────────
// Chiave assente = mai impostata (default automatico dalla dispensa); q = 0 = disattivata.
function seedDesired(name, qty, unit) {
  if (qty == null || !(qty > 0)) return false;
  const key = String(name).toLowerCase().trim();
  if (state.desired[key] !== undefined) return false;
  state.desired[key] = {q: qty, u: unit || "pz"};
  return true;
}
// Quanto manca per arrivare alla scorta desiderata; null se ok o non tracciato
function desiredMissing(key) {
  const d = state.desired[key];
  if (!d || !(d.q > 0)) return null;
  const p = state.pantry.find(x => x.name.toLowerCase().trim() === key);
  if (!p || p.qty == null) return {missing: d.q, unit: d.u, name: p ? p.name : key};
  const want = toBase(d.q, d.u);
  const have = toBase(p.qty, p.unit);
  if (want && have && want.d === have.d) {
    if (have.v >= want.v) return null;
    const perUnit = toBase(1, d.u).v;
    return {missing: Math.round(((want.v - have.v) / perUnit) * 100) / 100, unit: d.u, name: p.name};
  }
  // Stessa unità non convertibile (es. cucchiai): confronto numerico diretto
  if ((p.unit || "").toLowerCase() === d.u.toLowerCase()) {
    if (p.qty >= d.q) return null;
    return {missing: Math.round((d.q - p.qty) * 100) / 100, unit: d.u, name: p.name};
  }
  // Unità non confrontabili (es. 500 g in dispensa, scorta in pz): considera mancante l'intera scorta
  return {missing: d.q, unit: d.u, name: p.name};
}

let _toastTimer = null;
function toast(message, opts) {
  opts = opts || {};

  if (!el) return;
  el.innerHTML = `<span>${h(message)}</span>${opts.actionLabel ? `<button onclick="_toastAction()">${h(opts.actionLabel)}</button>` : ""}`;
  window._toastAction = () => { hideToast(); if (opts.onAction) opts.onAction(); };
  el.classList.add("show");
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(hideToast, opts.duration || 4500);
}
function hideToast() {
  const el = document.getElementById("toast");
  if (el) el.classList.remove("show");
}

// ── Scadenze ───────────────────────────────────────────
function getExpiryDays() {
  const v = parseInt(localStorage.getItem("cm:expdays"));
  return isNaN(v) || v < 0 ? 3 : v;
}
function setExpiryDaysVal(v) {
  localStorage.setItem("cm:expdays", String(Math.max(0, parseInt(v) || 0)));
  render();
}
function expDiffDays(exp) {
  const d = new Date(exp + "T00:00:00");
  if (isNaN(d)) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}
function expLabel(exp) {
  const diff = expDiffDays(exp);
  if (diff === null) return exp;
  if (diff < 0) return diff === -1 ? "scaduto ieri" : `scaduto (${-diff} gg)`;
  if (diff === 0) return "scade oggi";
  if (diff === 1) return "domani";
  if (diff <= 14) return `fra ${diff} gg`;
  const d = new Date(exp + "T00:00:00");
  return `${d.getDate()}/${d.getMonth()+1}`;
}
function expiringItems() {
  const days = getExpiryDays();
  return state.pantry
    .filter(p => p.exp && expDiffDays(p.exp) !== null && expDiffDays(p.exp) <= days)
    .sort((a,b) => expDiffDays(a.exp) - expDiffDays(b.exp));
}
function tagEl(tag) { return `<span class="tag tag-${h(tag)}">${h(TAGS[tag]?.label||tag)}</span>`; }
function dotEl(tag, sz=8) { return `<div class="dot" style="width:${sz}px;height:${sz}px;background:${h(TAGS[tag]?.dot||'#888')}"></div>`; }
function noticeEl(type, content) { return `<div class="notice notice-${type}">${content}</div>`; }
function btnEl(id, variant, text, extra="") { return `<button class="btn btn-${variant}" onclick="${id}()" ${extra}>${text}</button>`; }

function generateShoppingList() {
  const plan = state.weekPlan[weekKey(state.weekOffset)] || {};
  const bplan = state.weekBreakfast[weekKey(state.weekOffset)] || {};
  const meals = [];
  for (const [day, v] of Object.entries(plan)) {
    if (!v || isCustomEntry(v)) continue;
    const ref = planRef(v);
    const r = state.recipes.find(x => x.id === ref.id);
    if (r) meals.push({item: r, scale: ref.scale, day, meal: "cena"});
  }
  for (const [day, v] of Object.entries(bplan)) {
    if (!v || isCustomEntry(v)) continue;
    const ref = planRef(v);
    const b = state.breakfasts.find(x => x.id === ref.id);
    if (b) meals.push({item: b, scale: ref.scale, day, meal: "colazione"});
  }
  const agg = {};
  for (const m of meals) {
    for (const ing of m.item.ing) {
      const key = ing.n.toLowerCase().trim() + "::" + ing.u;
      const amt = ing.u === "qb" ? ing.a : Math.round(ing.a * m.scale * 100) / 100;
      if (agg[key]) { if (ing.u !== "qb") agg[key].amount += amt; }
      else agg[key] = {name: ing.n, amount: amt, unit: ing.u, sources: []};
      if (!agg[key].sources.some(s => s.recipeId === m.item.id && s.day === m.day && s.meal === m.meal)) {
        agg[key].sources.push({recipeId: m.item.id, recipeName: m.item.name, day: m.day, meal: m.meal});
      }
    }
  }
  const pmap = new Map(state.pantry.map(p => [p.name.toLowerCase().trim(), p]));
  const out = [];
  for (const i of Object.values(agg)) {
    const p = pmap.get(i.name.toLowerCase().trim());
    if (p && p.qty !== 0) { // qty 0 = esaurito: compra l'intera quantità
      // In dispensa: se la quantità è nota e confrontabile compra solo la differenza, altrimenti escludi
      const have = p.qty != null ? toBase(p.qty, p.unit) : null;
      const need = toBase(i.amount, i.unit);
      if (!have || !need || have.d !== need.d || i.unit === "qb" || !(i.amount > 0)) continue;
      if (have.v >= need.v) continue;
      i.amount = Math.round(((need.v - have.v) / toBase(1, i.unit).v) * 100) / 100;
    }
    out.push(i);
  }
  // Scorte: se hai meno della quantità desiderata, aggiungi la differenza
  for (const key of Object.keys(state.desired)) {
    const r = desiredMissing(key);
    if (!r) continue;
    const existing = out.find(i => i.name.toLowerCase().trim() === key);
    if (existing) {
      const a = toBase(existing.amount, existing.unit), b = toBase(r.missing, r.unit);
      if (a && b && a.d === b.d) {
        if (b.v > a.v) { existing.amount = r.missing; existing.unit = r.unit; existing.restock = true; }
      } else {
        // Unità non confrontabili con la voce già in lista: aggiungi la scorta come riga separata
        out.push({name: r.name, amount: r.missing, unit: r.unit, restock: true});
      }
    } else {
      out.push({name: r.name, amount: r.missing, unit: r.unit, restock: true});
    }
  }
  return out
    .sort((a,b) => a.name.localeCompare(b.name,"it"))
    .map(i => ({id:uid(), name:i.name, amount:i.amount, unit:i.unit, checked:false, manual:false, restock:!!i.restock, sources:i.sources||[], category:categorizeItem(i.name)}));
}

// Tab "Oggi": colazione/pranzo/cena del giorno corrente, promemoria serale,
// scadenze imminenti e stato della lista della spesa — sempre riferito alla settimana
// reale di oggi, indipendentemente da quale settimana si sta sfogliando in "Settimana".
function renderOggi() {
  const todayIdx = (new Date().getDay() + 6) % 7; // Lunedì=0 ... Domenica=6
  const todayName = DAYS[todayIdx];
  const wk = weekKey(0);
  const plan = state.weekPlan[wk] || {};
  const bplan = state.weekBreakfast[wk] || {};
  const lplan = state.weekLunch[wk] || {};

  const mealLine = (raw, list, type) => {
    const ref = raw ? planRef(raw) : null;
    if (ref && ref.custom) return `<span style="font-style:italic">${h(ref.text)}</span>`;
    const item = ref ? list.find(x => x.id === ref.id) : null;
    if (item) return `<span style="cursor:pointer;text-decoration:underline dotted;text-underline-offset:2px" onclick="openDetail('${item.id}','${type}')">${h(item.name)}</span>${ref.scale!==1?` <span style="color:#7C6FF0;font-weight:700;font-size:11px">${ref.scale}×</span>`:''}`;
    return null;
  };

  const breakfastLine = mealLine(bplan[todayName], state.breakfasts, "breakfast")
    || `<button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="state.weekOffset=0;openBreakfastPicker('${todayName}')">+ Aggiungi</button>`;
  const dinnerLine = mealLine(plan[todayName], state.recipes, "recipe")
    || `<button class="btn btn-outline" style="padding:4px 10px;font-size:12px" onclick="state.weekOffset=0;openPicker('${todayName}')">+ Aggiungi</button>`;

  const prevRaw = todayIdx > 0 ? plan[DAYS[todayIdx-1]] : null;
  const prevRef = prevRaw ? planRef(prevRaw) : null;
  const prevDinner = prevRef && !prevRef.custom ? state.recipes.find(r => r.id === prevRef.id) : null;
  const prevName = prevRef && prevRef.custom ? prevRef.text : (prevDinner ? prevDinner.name : null);
  const lunchCustom = lplan[todayName];
  const lunchLine = lunchCustom ? h(lunchCustom)
    : prevName ? `<span style="color:#888;font-style:italic">Avanzi: ${h(prevName)}</span>`
    : `<span style="color:#ccc">—</span>`;

  // Promemoria 🌙: colazione di domani da preparare stasera (gestisce anche il cambio settimana)
  const tomorrowRaw = todayIdx < 6 ? bplan[DAYS[todayIdx+1]] : (state.weekBreakfast[weekKey(1)] || {})[DAYS[0]];
  const tomorrowRef = tomorrowRaw ? planRef(tomorrowRaw) : null;
  const tomorrowB = tomorrowRef && !tomorrowRef.custom ? state.breakfasts.find(b => b.id === tomorrowRef.id) : null;
  const prepNotice = tomorrowB && tomorrowB.prepAhead
    ? noticeEl("warning", `🌙 Stasera prepara: <strong>${h(tomorrowB.name)}</strong> (colazione di domani)`) : "";

  const mealsCard = `<div class="card mb16">
    <div class="day-row"><span class="day-label">Colazione</span><div style="flex:1;font-size:13px">${breakfastLine}</div></div>
    <div class="day-row"><span class="day-label">Pranzo</span><div style="flex:1;font-size:13px">${lunchLine}</div></div>
    <div class="day-row"><span class="day-label">Cena</span><div style="flex:1;font-size:13px">${dinnerLine}</div></div>
  </div>`;

  const expiring = expiringItems();
  const expCard = expiring.length ? noticeEl("warning",
    `⏰ <strong>In scadenza:</strong> ${expiring.slice(0,5).map(p=>`${h(p.name)} (${expLabel(p.exp)})`).join(" · ")}${expiring.length>5?` e altri ${expiring.length-5}`:""}<br><span style="cursor:pointer;text-decoration:underline;font-weight:600" onclick="switchTab('dispensa')">Vai in Dispensa →</span>`
  ) : "";

  const todo = state.shopping.filter(i => !i.checked).length;
  const total = state.shopping.length;
  const shopCard = total === 0
    ? noticeEl("info", `Nessuna lista della spesa generata. <span style="cursor:pointer;text-decoration:underline;font-weight:600" onclick="switchTab('spesa')">Vai in Spesa →</span>`)
    : todo === 0
    ? noticeEl("success", `✓ Spesa completata (${total} articoli)`)
    : noticeEl("info", `🛒 <strong>${todo}</strong> di ${total} articoli ancora da comprare. <span style="cursor:pointer;text-decoration:underline;font-weight:600" onclick="switchTab('spesa')">Apri la lista →</span>`);

  const dateObj = getWeekDates(0)[todayIdx];
  const MONTHS_LONG = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  const dateLabel = `${todayName} ${dateObj.getDate()} ${MONTHS_LONG[dateObj.getMonth()]}`;

  return `<div style="font-size:13px;color:#999;margin-bottom:2px">${dateLabel}</div>
    <h2 style="font-size:19px;font-weight:700;margin-bottom:14px">Cosa mangiamo oggi?</h2>
    ${prepNotice}
    ${mealsCard}
    ${expCard}
    ${shopCard}`;
}

    ${custom ? `<button style="background:none;border:none;cursor:pointer;color:#ccc;font-size:16px;line-height:1;flex-shrink:0" title="Torna all'automatico" onclick="event.stopPropagation();clearLunchOverride('${ja(day)}')">↺</button>` : ""}
  </div>`;
}
function setLunchOverride(day, val) {
  val = String(val || "").trim();
  const lp = currentLunchPlan();
  if (val) lp[day] = val; else delete lp[day];
  state.editLunchDay = null;
  save("wl", state.weekLunch);
  render();
}
function clearLunchOverride(day) {
  delete currentLunchPlan()[day];
  save("wl", state.weekLunch);
  render();
}

function cycleMealScale(day, isBreakfast) {
  const planObj = isBreakfast ? currentBPlan() : currentPlan();
  const ref = planRef(planObj[day]);
  if (!ref || ref.custom) return;
  const order = [0.5, 1, 2];
  const next = order[(order.indexOf(ref.scale) + 1) % order.length];
  planObj[day] = planRawFor(ref.id, next);
  save(isBreakfast ? "wb" : "w", isBreakfast ? state.weekBreakfast : state.weekPlan);
  render();
}

function renderSettimana() {
  const plan = currentPlan();
  const bplan = currentBPlan();
  const filledDinner = Object.values(plan).filter(Boolean).length;
  const weekDates = getWeekDates(state.weekOffset);
  const MONTHS = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];
  const days = DAYS.map((day, i) => {
    const prevRaw = i > 0 ? (plan[DAYS[i-1]] || null) : null;
    const prevRef = prevRaw ? planRef(prevRaw) : null;
    const prev = prevRef && !prevRef.custom ? state.recipes.find(r => r.id === prevRef.id) : null;
    const prevName = prevRef && prevRef.custom ? prevRef.text : (prev ? prev.name : null);

    // Se la colazione di DOMANI richiede prep serale, mostra promemoria su OGGI
    const tomorrowRaw = i < DAYS.length - 1 ? bplan[DAYS[i+1]] : null;
    const tomorrowRef = tomorrowRaw ? planRef(tomorrowRaw) : null;
    const tomorrowBreakfast = tomorrowRef && !tomorrowRef.custom ? state.breakfasts.find(b => b.id === tomorrowRef.id) : null;
    const prepReminder = tomorrowBreakfast && tomorrowBreakfast.prepAhead
      ? `<span title="Prepara stanotte la colazione di ${DAYS[i+1]}" style="margin-left:auto;font-size:13px;cursor:default">🌙</span>`
      : "";

    const breakfastHtml = planEntryHtml(bplan[day] || null, day, true);
    const dinnerRaw = plan[day] || null;
    const dinnerRef = dinnerRaw ? planRef(dinnerRaw) : null;
    const dinnerHtml = planEntryHtml(dinnerRaw, day, false);
    const hasDinner = !!dinnerRef && (dinnerRef.custom || state.recipes.some(r => r.id === dinnerRef.id));

    const dateObj = weekDates[i];
    const dateStr = `${dateObj.getDate()} ${MONTHS[dateObj.getMonth()]}`;
    const isToday = dateObj.toDateString() === new Date().toDateString();
    const usatoBtn = hasDinner && !dinnerRef.custom ? `<button class="btn btn-green" style="font-size:11px;padding:3px 8px" onclick="markConsumed('${day}')">✓ Usato</button>` : "";
    return `<div class="day-card">
      <div class="day-header">
        <div>
          <div class="day-name"${isToday?' style="color:#E07C3B"':''}>${day}</div>
          <div class="day-date">${dateStr}</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px">${usatoBtn}${prepReminder}</div>
      </div>
      <div class="day-row">
        <span class="day-label">Colazione</span>
        ${breakfastHtml}
      </div>
      <div class="day-row">
        <span class="day-label">Pranzo</span>
        ${lunchEntryHtml(day, prevName)}
      </div>
      <div class="day-row">
        <span class="day-label">Cena</span>
        ${dinnerHtml}
      </div>
    </div>`;
  }).join("");
  const weekLabel = `${weekDates[0].getDate()} ${MONTHS[weekDates[0].getMonth()]} – ${weekDates[6].getDate()} ${MONTHS[weekDates[6].getMonth()]}`;
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <button class="btn btn-outline" style="padding:5px 10px" onclick="state.weekOffset--;render()">←</button>
      <span style="font-size:13px;font-weight:600;color:#555">${weekLabel}</span>
      <button class="btn btn-outline" style="padding:5px 10px" onclick="state.weekOffset++;render()">→</button>
    </div>
    ${noticeEl("info","La cena diventa automaticamente il <strong>pranzo del giorno dopo</strong>. 🌙 = prepara la colazione di domani stasera.")}
    ${filledDinner < 7 ? `<button class="btn btn-outline mb12" style="width:100%;justify-content:center" onclick="autoFillWeek()">✨ Riempi le cene vuote con ricette di stagione</button>` : ""}
    ${filledDinner===7 ? noticeEl("success","✓ Cene complete! Vai su <strong>Spesa</strong> per generare la lista.") : ""}
    ${days}`;
}

      </div>
      <div style="flex:1;overflow-y:auto;padding:8px 20px 16px">
        <div style="font-size:12px;color:#888;margin:8px 0">Presente in queste ricette pianificate:</div>
        ${(sourceItem.sources||[]).map(s => `<div style="padding:8px 0;border-bottom:1px solid #f0f0f0;font-size:14px;color:#111">${h(s.recipeName)} <span style="color:#888">— ${h(s.day)} (${h(s.meal)})</span></div>`).join("")}
      </div>
    </div>
  </div>` : "";

  return sourceModal + headerCard + progressBar + addExtra + todoSect + doneSect;
}

  if (!item) return "<p>Non trovato.</p>";
  const bm = isBreakfast ? bMeta(item.prepAhead) : null;
  const accentColor = bm ? bm.col : (TAGS[item.tag]?.dot||"#333");
  const badge = bm ? `<span class="b-badge" style="background:${bm.bg};color:${bm.col}">${bm.lbl}</span>` : tagEl(item.tag);
  const sub = isBreakfast ? "" : ` · ${item.grain} · ${item.protein}`;
  const delBtn = state.deleteConfirm === item.id
    ? `<div style="display:flex;gap:8px;align-items:center"><span style="font-size:12px;color:#B91C1C">Sicuro?</span><button class="btn btn-danger" onclick="confirmDelete('${item.id}')">Sì</button><button class="btn btn-ghost" onclick="state.deleteConfirm=null;render()">No</button></div>`
    : `<div style="display:flex;gap:12px;align-items:center">
        <button class="btn btn-ghost" style="font-size:12px" onclick="startEdit('${item.id}')">✏️ Modifica</button>
        <button class="btn btn-ghost" style="color:#B91C1C;font-size:12px" onclick="state.deleteConfirm='${item.id}';render()">Elimina</button>
       </div>`;
  const scale = state.portionScale;
  const scaleBtns = `<div class="filter-bar" style="margin:0">${[[0.5,"½×"],[1,"1×"],[2,"2×"]].map(([s,l]) =>
    `<button class="filter-btn ${scale===s?'active':''}" onclick="setScale(${s})">${l}</button>`).join("")}</div>`;
  const ings = item.ing.map(ing => `<div class="detail-ing-row">
    <div style="width:5px;height:5px;border-radius:50%;background:${accentColor};flex-shrink:0"></div>
    <span style="flex:1;color:#111">${h(ing.n)}</span>
    <span style="color:#666">${ing.u==="qb"?"q.b.":`${Math.round(ing.a*scale*100)/100} ${h(ing.u)}`}</span>
  </div>`).join("");
  const steps = item.steps.map((step,i) => `<div class="step-row">
    <div class="step-num" style="background:${accentColor}">${i+1}</div>
    <span style="color:#222">${h(step)}</span>
  </div>`).join("");
  return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <button class="btn btn-ghost" onclick="showView('list')">← Indietro</button>
    ${delBtn}
  </div>
  ${badge}
  <h2 style="font-size:20px;font-weight:700;margin:10px 0 4px;line-height:1.3;color:#111">${h(item.name)}</h2>
  <p style="font-size:13px;color:#666;margin:0 0 12px">⏱ ${h(item.time)}${sub}</p>
  ${item.note ? noticeEl("warning","💡 " + h(item.note)) : ""}
  <div style="display:flex;justify-content:space-between;align-items:center;margin:1rem 0 6px">
    <h3 style="font-size:15px;font-weight:600;color:#111">Ingredienti <span style="font-size:12px;font-weight:400;color:#888">(2 adulti + 1 bambino)</span></h3>
    ${scaleBtns}
  </div>
  ${ings}
  <h3 style="font-size:15px;font-weight:600;margin:1.4rem 0 6px;color:#111">Preparazione</h3>
  ${steps}`;
}

function ingRowsHtml(ings) {
  return ings.map((ing,idx) => `<div class="ing-row">
    <input class="input" value="${h(ing.n)}" placeholder="Ingrediente" oninput="updateIng(${idx},'n',this.value)">
    <input class="input" type="number" value="${ing.a||''}" placeholder="Qtà" oninput="updateIng(${idx},'a',this.value)">
    <select class="input" onchange="updateIng(${idx},'u',this.value)">${UNITS.map(u=>`<option value="${u}" ${ing.u===u?"selected":""}>${u}</option>`).join("")}</select>
    <button class="ing-del" onclick="removeIng(${idx})">×</button>
  </div>`).join("");
}

function emptyMealForm(isBreakfast) {
  return isBreakfast
    ? {name:"",time:"",prepAhead:false,note:"",steps:"",ings:[{n:"",a:"",u:"g"}]}
    : {tag:"primavera",name:"",time:"",grain:"",protein:"",note:"",steps:"",ings:[{n:"",a:"",u:"g"}]};

// Form unico per aggiunta/modifica di ricette e colazioni

function render() {

  if (state.view === "picker") { el.innerHTML = renderPicker(); return; }

  if (state.view === "addRecipe") { el.innerHTML = renderMealForm(false, false); return; }
  if (state.view === "editRecipe") { el.innerHTML = renderMealForm(false, true); return; }
  if (state.view === "editBreakfast") { el.innerHTML = renderMealForm(true, true); return; }
  if (state.view === "addBreakfast") { el.innerHTML = renderMealForm(true, false); return; }
  if (state.view === "importCSV") { el.innerHTML = renderImportCSV(); return; }
  if (state.tab === "oggi") el.innerHTML = renderOggi();
  else if (state.tab === "ricette") el.innerHTML = renderRicette();

  else if (state.tab === "spesa") el.innerHTML = renderSpesa();

}

function renderImpostazioni() {
  const customMap = getCustomCatMap();
  const merged = getMergedCatMap();
  const orderedCats = orderedShopCats();
  const catOpts = orderedCats.map(c => `<option value="${c.id}">${c.label}</option>`).join("");

  // Tutti gli ingredienti noti + quelli in dispensa non ancora mappati
  const allNames = Object.assign({}, merged);
  for (const p of state.pantry) {
    const k = p.name.toLowerCase().trim();
    if (!(k in allNames)) allNames[k] = categorizeItem(k);
  }
  const q = state.catSearch.trim().toLowerCase();
  // Le frecce di riordino spostano rispetto alla categoria "vicina visibile" successiva/precedente
  // (ignorando quelle senza alcun ingrediente), non alla posizione grezza: altrimenti cliccare
  // non produrrebbe alcun cambiamento visibile se il vicino nell'ordine risultasse vuoto.
  // Mostrate solo a filtri disattivati, per non riordinare in base a una vista parziale.
  const canReorder = !q && state.catFilter === "tutte";
  const visibleCatIds = orderedCats.filter(c => Object.keys(allNames).some(n => allNames[n] === c.id)).map(c => c.id);

  const sections = orderedCats.map((cat) => {
    let entries = Object.keys(allNames).filter(n => allNames[n] === cat.id);
    if (state.catFilter === "scorta") entries = entries.filter(n => state.desired[n] && state.desired[n].q > 0);
    if (q) entries = entries.filter(n => n.includes(q));
    if (entries.length === 0) return '';
    entries.sort((a,b) => a.localeCompare(b,"it"));
    const rows = entries.map(name => {
      const isCustom = customMap[name] === cat.id;
      const d = state.desired[name];
      const tracked = d && d.q > 0;
      const low = tracked && desiredMissing(name);
      const qtyCtl = tracked
        ? `<div style="display:flex;align-items:center;gap:3px" title="Scorta desiderata">
            <button style="width:22px;height:22px;border-radius:6px;border:1px solid #ddd;background:#f5f5f5;font-size:13px;line-height:1;cursor:pointer" onclick="adjustDesired('${ja(name)}',-1)">−</button>
            <span style="min-width:34px;text-align:center;font-size:12px;font-weight:600;color:#555">${d.q}</span>
            <select style="font-size:11px;border:1px solid #ddd;border-radius:6px;padding:1px 2px;font-family:inherit;color:#888" onchange="setDesiredUnit('${ja(name)}',this.value)">${["g","kg","ml","l","pz"].map(u=>`<option value="${u}"${d.u===u?' selected':''}>${u}</option>`).join('')}</select>
            <button style="width:22px;height:22px;border-radius:6px;border:1px solid #ddd;background:#f5f5f5;font-size:13px;line-height:1;cursor:pointer" onclick="adjustDesired('${ja(name)}',1)">+</button>
          </div>`
        : `<button style="font-size:11px;font-weight:600;color:#7C6FF0;background:#EEEEFF;border:none;border-radius:10px;padding:4px 8px;cursor:pointer;white-space:nowrap" title="Attiva scorta minima" onclick="adjustDesired('${ja(name)}',1)">📦 +</button>`;
      return `<div class="cat-row" style="display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid #f5f5f5;flex-wrap:wrap">
        <span style="flex:1;min-width:110px;font-size:13px;color:${isCustom?'#1E4D8C':'#111'}">${h(name)}${isCustom?'<span style="font-size:10px;color:#3A6EA5;margin-left:4px">★</span>':''}${low?' <span style="color:#B45309" title="Sotto scorta">▼</span>':''}</span>
        ${qtyCtl}
        <select style="font-size:12px;border:1px solid #ddd;border-radius:6px;padding:2px 4px;font-family:inherit" onchange="moveCatItem('${ja(name)}',this.value)">${orderedCats.map(c=>`<option value="${c.id}"${c.id===cat.id?' selected':''}>${c.label.split(' ').slice(1).join(' ')}</option>`).join('')}</select>
        ${customMap[name]?`<button style="background:none;border:none;color:#ccc;cursor:pointer;font-size:16px" onclick="resetCatItem('${ja(name)}')">×</button>`:'<span style="width:20px"></span>'}
      </div>`;
    }).join("");
    let reorderBtns = "";
    if (canReorder) {
      const vIdx = visibleCatIds.indexOf(cat.id);
      const upBtn = vIdx > 0 ? `<button style="background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;padding:2px 4px" title="Sposta su" onclick="moveCatOrder('${cat.id}','${visibleCatIds[vIdx-1]}')">▲</button>` : `<span style="width:19px"></span>`;
      const downBtn = vIdx < visibleCatIds.length - 1 ? `<button style="background:none;border:none;color:#aaa;cursor:pointer;font-size:13px;padding:2px 4px" title="Sposta giù" onclick="moveCatOrder('${cat.id}','${visibleCatIds[vIdx+1]}')">▼</button>` : `<span style="width:19px"></span>`;
      reorderBtns = upBtn + downBtn;
    }
    return `<div class="card mb12">
      <div class="cat-hdr"><span>${cat.label}</span><span style="display:flex;align-items:center;gap:6px"><span style="font-weight:400;color:#aaa">${entries.length}</span>${reorderBtns}</span></div>
      ${rows}
    </div>`;
  }).join("");

  // ── Sincronizzazione ──
  const tokenSet = !!getToken();
  const syncCard = `<div class="card mb16" style="padding:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">🔐 Sincronizzazione</div>
    <p style="font-size:12px;color:#888;line-height:1.5;margin-bottom:10px">Il token non è salvato nel codice dell'app: inseriscilo una volta per dispositivo. Deve corrispondere al segreto <strong>AUTH_TOKEN</strong> del Worker Cloudflare.</p>
    <div style="font-size:12px;margin-bottom:10px;color:${tokenSet?'#166534':'#B45309'}">${tokenSet?'✓ Sync attiva su questo dispositivo':'⚠ Sync non configurata: i dati restano solo su questo dispositivo'}</div>
    <div style="display:flex;gap:8px">
      <input class="input" type="password" id="sync-token" placeholder="${tokenSet?'Nuovo token (sostituisce quello attuale)':'Token di sincronizzazione'}" style="flex:1">
      <button class="btn btn-primary" onclick="saveToken()">Salva</button>
    </div>
    ${tokenSet?`<button class="btn btn-ghost mt8" style="font-size:12px;color:#B91C1C" onclick="clearToken()">Disattiva sync su questo dispositivo</button>`:''}
  </div>`;

  // ── Scadenze ──
  const expiryCard = `<div class="card mb16" style="padding:12px">
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">⏰ Avvisi di scadenza</div>
    <p style="font-size:12px;color:#888;line-height:1.5;margin-bottom:10px">Imposta la data di scadenza sui singoli alimenti in <strong>Dispensa</strong> (icona 📅). Gli alimenti in scadenza vengono evidenziati e segnalati con ⚠️ sul tab.</p>
    <div style="display:flex;align-items:center;gap:8px">
      <label style="font-size:13px;color:#444">Avvisa con</label>
      <input class="input" type="number" min="0" max="30" value="${getExpiryDays()}" style="width:70px" onchange="setExpiryDaysVal(this.value)">
      <span style="font-size:13px;color:#444">giorni di anticipo</span>
    </div>
  </div>`;

  const catTools = `<div style="margin-bottom:10px">
      <input class="input" id="cat-search" value="${h(state.catSearch)}" placeholder="🔍 Cerca ingrediente..." autocomplete="off" oninput="setCatSearch(this.value)">
    </div>
    <div class="filter-bar">
      <button class="filter-btn ${state.catFilter==='tutte'?'active':''}" onclick="state.catFilter='tutte';render()">Tutti</button>
      <button class="filter-btn ${state.catFilter==='scorta'?'active':''}" onclick="state.catFilter='scorta';render()">📦 Con scorta impostata</button>
    </div>`;

  return `${syncCard}
    ${expiryCard}
    <div style="font-size:14px;font-weight:700;margin-bottom:6px">🗂 Ingredienti: categorie e scorte</div>
    ${noticeEl("info","Ogni ingrediente ha la sua <strong>categoria</strong> (dove appare in Dispensa e Spesa) e una <strong>scorta desiderata</strong> (📦): se ne hai meno in dispensa, la differenza entra in lista spesa con l'etichetta <span style=\"color:#7C6FF0;font-weight:600\">scorta</span>. La scorta parte dalla quantità che hai ora; nelle righe ▼ = sotto scorta, ★ = personalizzazione tua. Usa le frecce ▲▼ sull'intestazione per riordinare le categorie: seguono lo stesso ordine in Dispensa e Spesa, utile per rispecchiare il percorso al supermercato.")}
    <div class="card mb16" style="padding:12px">
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">Aggiungi regola</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <input class="input" id="new-cat-name" placeholder="Nome ingrediente" style="flex:1;min-width:120px">
        <select class="input" id="new-cat-cat" style="flex:1;min-width:120px">${catOpts}</select>
        <button class="btn btn-primary" onclick="addCatRule()">Aggiungi</button>
      </div>
    </div>
    ${catTools}
    ${Object.keys(customMap).length > 0 ? `<button class="btn btn-outline mb12" onclick="resetAllCatRules()">↺ Ripristina default</button>` : ''}
    ${sections || noticeEl("info","Nessun ingrediente corrisponde ai filtri.")}`;
}

// Estrae gli id ricetta usati in una settimana (ignora voci custom e considera sia il formato
// stringa che {id,scale})
function recipeIdsIn(weekObj) {
  const s = new Set();
  if (weekObj) for (const v of Object.values(weekObj)) { const ref = planRef(v); if (ref && !ref.custom) s.add(ref.id); }
  return s;
}
function autoFillWeek() {
  const plan = currentPlan();
  const empty = DAYS.filter(d => !plan[d]);
  if (!empty.length) return;
  const season = seasonForDate(getWeekDates(state.weekOffset)[0]);

  const used = recipeIdsIn(plan);
  // Evita di riproporre ricette già cucinate in questa settimana o nelle due precedenti
  const recent = new Set(used);
  for (const off of [state.weekOffset - 1, state.weekOffset - 2]) {
    for (const id of recipeIdsIn(state.weekPlan[weekKey(off)])) recent.add(id);
  }

  // Priorità a ricette che usano ingredienti in scadenza in dispensa
  const expiringNames = expiringItems().map(p => p.name.toLowerCase().trim());
  const expiryScore = r => expiringNames.filter(name =>
    r.ing.some(i => { const n = i.n.toLowerCase().trim(); return containsWord(name, n) || containsWord(n, name); })
  ).length;

  let pool = state.recipes.filter(r => !used.has(r.id));
  if (!pool.length) return;
  // Punteggio: stagione corretta (peso alto) + non cucinata di recente + ingredienti in scadenza,
  // con un piccolo margine casuale per non proporre sempre lo stesso ordine
  pool = pool
    .map(r => ({r, score: (r.tag === season ? 10 : 0) + (recent.has(r.id) ? 0 : 4) + expiryScore(r) * 3 + Math.random()}))
    .sort((a, b) => b.score - a.score)
    .map(x => x.r);

  const assigned = new Set();
  empty.forEach((d, i) => {
    const pick = pool.find(r => !assigned.has(r.id)) || pool[i % pool.length];
    if (!pick) return;
    assigned.add(pick.id);
    plan[d] = pick.id;
  });
  save("w", state.weekPlan);
  render();
}

function shareShopping() {

// Filtra le voci di un dropdown suggerimenti; showAllWhenEmpty: mostra tutto a campo vuoto
function filterDrop(dropId, val, showAllWhenEmpty) {
  const drop = document.getElementById(dropId);
  if (!drop) return;
  const q = val.trim().toLowerCase();
  if (!q && !showAllWhenEmpty) { drop.style.display = "none"; return; }
  let visible = 0;
  drop.querySelectorAll("div").forEach(el => {
    const match = !q || el.textContent.toLowerCase().includes(q);
    el.style.display = match ? "" : "none";
    if (match) visible++;
  });
  drop.style.display = visible > 0 ? "" : "none";
}
function filterPantryDrop(val) { filterDrop("pantry-dropdown", val, true); }
function filterShopDrop(val) { filterDrop("shop-dropdown", val, false); }

// Rigenera le sole voci auto-generate (manual:false), preservando le voci manuali e lo stato
// "comprato" delle voci che restano necessarie — non butta via nulla che l'utente ha già spuntato o aggiunto a mano.
function doGenerate() {
  const fresh = generateShoppingList();
  const prevAuto = new Map();
  for (const i of state.shopping) if (!i.manual) prevAuto.set(i.name.toLowerCase().trim() + "::" + i.unit, i);
  const merged = fresh.map(item => {
    const prev = prevAuto.get(item.name.toLowerCase().trim() + "::" + item.unit);
    return prev ? {...item, id: prev.id, checked: prev.checked} : item;
  });
  const manual = state.shopping.filter(i => i.manual);
  state.shopping = merged.concat(manual);
  save("s", state.shopping);
  render();
}

function removeShopItem(id) { state.shopping=state.shopping.filter(i=>i.id!==id); save("s",state.shopping); render(); }

async function handleCSVFile(input) {
  const f=input.files[0]; if(!f)return;
  const text=await f.text();
  document.getElementById("csv-text").value=text;
  previewCSV(text);
}
// Divide una riga CSV rispettando i campi tra virgolette ("" = virgoletta letterale)
function splitCSVLine(line) {
  const out = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') { if (line[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    }
    else if (c === '"') inQ = true;
    else if (c === ',') { out.push(cur); cur = ""; }
    else cur += c;
  }
  out.push(cur);
  return out;
}
function previewCSV(text) {
  const el=document.getElementById("csv-preview"); if(!el)return;
  if(!text.trim()){el.innerHTML="";return;}
  try {
    const lines=text.trim().split(/\r?\n/); if(lines.length<2){el.innerHTML=noticeEl("warning","Almeno 2 righe necessarie.");return;}
    const header=splitCSVLine(lines[0]).map(h=>h.trim());
    const parsed=lines.slice(1).filter(l=>l.trim()).map(line=>{
      const vals=splitCSVLine(line); const row={};
      header.forEach((h,i)=>{row[h]=(vals[i]||"").trim();});
      return{id:uid(),tag:row.tag||"primavera",name:row.name||"Senza nome",time:row.time||"",grain:row.grain||"",protein:row.protein||"",note:row.note||"",
        ing:(row.ingredients||"").split("|").filter(Boolean).map(s=>{const[n,a,u]=s.split(":");return{n:(n||"").trim(),a:parseFloat(a)||0,u:(u||"qb").trim()};}),
        steps:(row.steps||"").split("|").filter(Boolean).map(s=>s.trim())};
    });
    const preview=parsed.map(r=>`<div style="padding:8px 12px;background:#F5F5F5;border-radius:8px;font-size:13px;display:flex;align-items:center;gap:8px;margin-bottom:6px">${dotEl(r.tag)}<span style="flex:1">${h(r.name)}</span>${tagEl(r.tag)}</div>`).join("");
    el.innerHTML=`<div class="mt12">${noticeEl("success",parsed.length+" ricett"+(parsed.length>1?"e":"a")+" pronta"+(parsed.length>1?"e":"")+" per l'importazione")}<div class="mt12">${preview}</div><button class="btn btn-primary mt12" onclick="importParsed()">Importa ${parsed.length} ricett${parsed.length>1?"e":"a"}</button></div>`;
    el._parsed=parsed;
  } catch(e){el.innerHTML=noticeEl("warning","Formato non valido: "+e.message);}
}
function importParsed() {
  const el=document.getElementById("csv-preview"); if(!el||!el._parsed)return;
  state.recipes.push(...el._parsed); save("r",state.recipes); state.view="list"; state.tab="ricette"; state.mealView="cene"; render();
}

function markConsumed(day) {
  const raw = currentPlan()[day];
  if (!raw || isCustomEntry(raw)) return;
  const ref = planRef(raw);
  const recipe = state.recipes.find(r => r.id === ref.id);
  if (!recipe) return;
  const scale = ref.scale;
  // Match per nome esatto o prefisso ("riso" ↔ "riso integrale"),
  // ma non per parola interna ("limone" non tocca "succo di limone")
  const matches = (pn, n) => pn === n || pn.startsWith(n + " ") || n.startsWith(pn + " ");
  const prevPantry = state.pantry;
  const remaining = [];
  for (const p of prevPantry) {
    const pn = p.name.toLowerCase().trim();
    const ing = recipe.ing.find(i => matches(pn, i.n.toLowerCase().trim()));
    if (!ing) { remaining.push(p); continue; }
    const used = ing.a > 0 ? toBase(ing.a * scale, ing.u) : null;
    if (!used) { remaining.push(p); continue; } // "qb": non consuma la scorta
    const have = p.qty != null ? toBase(p.qty, p.unit) : null;
    if (have && have.d === used.d && have.v > used.v) {
      // Quantità note e confrontabili: scala solo il consumato (senza mutare l'originale, serve per l'annulla)
      remaining.push({...p, qty: Math.round(((have.v - used.v) / toBase(1, p.unit).v) * 100) / 100});
    }
    // Altrimenti (quantità ignota o consumata del tutto): rimuovi l'articolo
  }
  state.pantry = remaining;
  save("p", state.pantry);
  render();
  toast(`Ingredienti di "${recipe.name}" scalati dalla dispensa`, {
    actionLabel: "Annulla",
    onAction: () => { state.pantry = prevPantry; save("p", state.pantry); render(); }
  });
}

function copyPantry() {
  if (state.pantry.length === 0) { toast("La dispensa è vuota."); return; }
  const text = state.pantry.map(p => p.qty ? `${p.name} - ${p.qty}${p.unit?' '+p.unit:''}` : p.name).join("\n");
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('[onclick="copyPantry()"]');
    if (btn) { btn.textContent = "✓ Copiata!"; setTimeout(() => { btn.textContent = "📋 Copia dispensa"; }, 2000); }
  }).catch(() => toast("Errore durante la copia"));
}

function clearPantry() {
  if (state.pantry.length === 0) return;
  const prevPantry = state.pantry;
  state.pantry = [];
  save("p", state.pantry);
  render();
  toast(`Dispensa svuotata (${prevPantry.length} element${prevPantry.length===1?'o':'i'})`, {

}

function togglePantryCat(catId) {

  render();
}

function adjustPantryQty(id, delta) {
  const item = state.pantry.find(p => p.id === id);
  if (!item) return;
  const current = item.qty != null ? item.qty : 0;
  // 0 resta 0 ("esaurito"), diverso da null ("quantità sconosciuta"):
  // a zero l'ingrediente torna acquistabile nella lista della spesa
  item.qty = Math.max(0, Math.round((current + delta) * 100) / 100);
  // Prima quantità impostata → diventa anche la scorta desiderata di default
  if (seedDesired(item.name, item.qty, item.unit)) save("d", state.desired);
  save("p", state.pantry);
  render();
}

function adjustDesired(name, dir) {
  const key = String(name).toLowerCase().trim();
  const cur = state.desired[key];
  const p = state.pantry.find(x => x.name.toLowerCase().trim() === key);
  if (!cur || !(cur.q > 0)) {
    if (dir <= 0) return;
    const unit = (cur && cur.u) || (p && p.unit) || "pz";
    const q = p && p.qty != null && p.qty > 0 ? p.qty : qtyStep(unit);
    state.desired[key] = {q, u: unit};
  } else {
    const step = qtyStep(cur.u);
    const q = Math.max(0, Math.round((cur.q + dir * step) * 100) / 100);
    state.desired[key] = {q, u: cur.u};
  }
  save("d", state.desired);
  render();
}

function setDesiredUnit(name, u) {
  const key = String(name).toLowerCase().trim();
  const cur = state.desired[key];
  if (!cur) return;
  cur.u = u;
  save("d", state.desired);
  render();
}

// Importa in dispensa righe nel formato "nome - quantità unità" (output del prompt scontrino)
function importReceiptText(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let added = 0, updated = 0;
  for (const line of lines) {
    const parts = line.split(/\s*[-–—]\s*/);
    const name = (parts[0] || '').trim();
    if (!name) continue;
    const rest = (parts[1] || '').trim();
    const m = rest.match(/^([\d.,]+)\s*(.*)$/);
    const qty = m ? parseFloat(m[1].replace(',', '.')) : null;
    const unit = m ? (m[2].trim() || 'pz') : '';
    const existing = state.pantry.find(p => p.name.toLowerCase() === name.toLowerCase());
    if (existing) {
      if (qty !== null) existing.qty = (existing.qty || 0) + qty;
      seedDesired(existing.name, existing.qty, existing.unit);
      updated++;
    } else {
      state.pantry.push({id:uid(), name, qty: qty||null, unit, category: categorizeItem(name)});
      seedDesired(name, qty, unit);
      added++;
    }
  }
  save("p", state.pantry);
  save("d", state.desired);
  state.showReceiptModal = false;
  render();
  toast(`Importati: ${added} nuovi, ${updated} aggiornati.`);
}

function importPastedReceipt() {

  if (!ta || !ta.value.trim()) { toast("Incolla prima il testo nell'area di testo."); return; }

}

function receiptPrompt() {
  return `Analizza la foto di questo scontrino e generami un file .txt con un alimento per riga nel formato:\nnome prodotto - quantità unità\n\nUsa ESATTAMENTE uno di questi nomi quando possibile (scegli il più adatto):\n${getAllKnownIngredients().join("\n")}\n\nPer prodotti non in lista usa nomi generici senza marchi né varietà.\nIgnora prodotti non alimentari (detersivi, cosmetici, ecc.).\nUnità accettate: g, kg, ml, l, pz\n\nEsempio output:\nuova - 6 pz\nlatte - 1 l\npasta - 500 g`;
}

function copyReceiptPrompt() {
  navigator.clipboard.writeText(receiptPrompt()).then(() => {
    const btn = document.querySelector('[onclick="copyReceiptPrompt()"]');
    if (btn) { btn.textContent = "✓ Copiato!"; setTimeout(() => { btn.textContent = "📋 Copia prompt"; }, 2000); }
  }).catch(() => toast("Copia manuale: seleziona il testo nel riquadro grigio"));
}

function handlePantryTxt(input) {

}

// ═══════════════════════════════════════════════════════

loadLocal();
render();
if (!getToken()) updateSyncBadge("⚙️ Configura sincronizzazione");
loadRemote().then(()=>render()).catch(()=>{});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});

// Al ritorno in foreground: refresh immediato della spesa se è il tab attivo (per fare la spesa
// in due sullo stesso momento), refresh completo di tutte le chiavi se si è stati via un po'
// (un altro dispositivo potrebbe aver modificato ricette, dispensa, piano...).
let _hiddenAt = 0;
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { _hiddenAt = Date.now(); return; }
  if (state.tab === "spesa") refreshShopping();
  if (!_hiddenAt || Date.now() - _hiddenAt > 20000) refreshAllFromRemote();
});
// Mentre si è sul tab Spesa, controlla periodicamente eventuali modifiche di un altro
// dispositivo (es. si fa la spesa insieme, ognuno con il telefono in mano).
setInterval(() => {
  if (state.tab === "spesa" && !document.hidden) refreshShopping();
}, 15000);
